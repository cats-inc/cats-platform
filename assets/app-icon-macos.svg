<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!--
    macOS app icon (.icns): the artwork of assets/app-icon-silhouette.svg on a white
    rounded tile. The whiskers are navy because the cream ones vanish on white.
    Keep the cat in sync with app-icon-silhouette.svg; regenerate with
    `npm run desktop:icons`, which also insets the tile per Apple's grid.
  -->
  <rect width="512" height="512" rx="116" fill="#FFFFFF"/>
  <defs>
    <clipPath id="headClip">
      <path d="
        M 256 420
        C 168 420, 96 364, 96 276
        C 96 244, 104 214, 118 190
        L 100 92
        C 98 80, 110 74, 120 80
        L 200 128
        C 218 122, 236 120, 256 120
        C 276 120, 294 122, 312 128
        L 392 80
        C 402 74, 414 80, 412 92
        L 394 190
        C 408 214, 416 244, 416 276
        C 416 364, 344 420, 256 420 Z"/>
    </clipPath>
  </defs>
  <!-- head base -->
  <path fill="#E8923A" d="
    M 256 420
    C 168 420, 96 364, 96 276
    C 96 244, 104 214, 118 190
    L 100 92
    C 98 80, 110 74, 120 80
    L 200 128
    C 218 122, 236 120, 256 120
    C 276 120, 294 122, 312 128
    L 392 80
    C 402 74, 414 80, 412 92
    L 394 190
    C 408 214, 416 244, 416 276
    C 416 364, 344 420, 256 420 Z"/>
  <!-- tabby stripes, clipped to the head -->
  <g clip-path="url(#headClip)" fill="#B85C24">
    <!-- forehead M -->
    <path d="M 226 132 C 234 160, 236 186, 232 214 C 224 196, 220 168, 214 138 Z"/>
    <path d="M 256 128 C 262 158, 262 188, 256 218 C 250 188, 250 158, 256 128 Z"/>
    <path d="M 286 132 C 278 160, 276 186, 280 214 C 288 196, 292 168, 298 138 Z"/>
    <!-- cheek stripes, left -->
    <path d="M 96 248 C 128 244, 150 250, 168 262 C 148 262, 126 262, 96 270 Z"/>
    <path d="M 100 296 C 130 290, 152 292, 170 302 C 150 304, 128 308, 104 318 Z"/>
    <path d="M 116 344 C 140 336, 158 336, 176 342 C 158 348, 140 356, 124 366 Z"/>
    <!-- cheek stripes, right -->
    <path d="M 416 248 C 384 244, 362 250, 344 262 C 364 262, 386 262, 416 270 Z"/>
    <path d="M 412 296 C 382 290, 360 292, 342 302 C 362 304, 384 308, 408 318 Z"/>
    <path d="M 396 344 C 372 336, 354 336, 336 342 C 354 348, 372 356, 388 366 Z"/>
    <!-- ear tips -->
    <path d="M 104 84 L 130 100 L 118 160 Z"/>
    <path d="M 408 84 L 382 100 L 394 160 Z"/>
  </g>
  <!-- inner ears -->
  <path fill="#F7C9A3" d="M 136 118 L 190 150 C 176 160, 166 172, 158 186 Z"/>
  <path fill="#F7C9A3" d="M 376 118 L 322 150 C 336 160, 346 172, 354 186 Z"/>
  <!-- muzzle -->
  <path fill="#FFF1DC" d="M 256 402 C 200 402, 160 372, 160 330 C 160 300, 190 292, 220 300 C 236 304, 246 312, 256 312 C 266 312, 276 304, 292 300 C 322 292, 352 300, 352 330 C 352 372, 312 402, 256 402 Z"/>
  <!-- eyes -->
  <ellipse cx="204" cy="258" rx="18" ry="28" fill="#1B2233"/>
  <ellipse cx="308" cy="258" rx="18" ry="28" fill="#1B2233"/>
  <!-- nose and mouth -->
  <path fill="#E2604A" d="M 236 316 L 276 316 L 256 340 Z"/>
  <path d="M 256 340 L 256 358 M 256 358 C 244 374, 226 372, 218 360 M 256 358 C 268 374, 286 372, 294 360" fill="none" stroke="#1B2233" stroke-width="8" stroke-linecap="round"/>
  <!-- whiskers -->
  <g stroke="#1B2233" stroke-width="10" stroke-linecap="round" fill="none">
    <path d="M 168 328 L 62 306"/>
    <path d="M 168 350 L 56 352"/>
    <path d="M 344 328 L 450 306"/>
    <path d="M 344 350 L 456 352"/>
  </g>
</svg>
