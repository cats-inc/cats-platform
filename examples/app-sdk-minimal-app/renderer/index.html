<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Minimal Example</title>
  <style>
    body { font: 14px/1.5 system-ui, sans-serif; margin: 24px; }
    body[data-theme="dark"] { background: #1f1f1f; color: #eee; }
  </style>
</head>
<body>
  <h1>Minimal Example</h1>
  <p id="identity">Waiting for the host…</p>
  <button id="lobby" type="button">Back to Lobby</button>
  <script>
    // The host injects globalThis.catsApp before this script runs; the App bundles no bridge.
    const app = globalThis.catsApp;
    if (app) {
      document.body.dataset.theme = app.theme;
      document.getElementById('identity').textContent = `${app.appId} ${app.version} · ${app.locale}`;
      document.getElementById('lobby').addEventListener('click', () => app.openLobby());
    }
  </script>
</body>
</html>
