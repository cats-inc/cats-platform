name: cats-platform npm publish

on:
  workflow_dispatch:
    inputs:
      dist_tag:
        description: 'npm dist-tag to publish under'
        required: true
        default: next
        type: choice
        options:
          - next
          - latest

permissions:
  contents: read
  id-token: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      # npm trusted publishing (OIDC) requires npm 11.5.1+.
      - name: Update npm for trusted publishing
        run: npm install -g npm@^11.5.1

      - name: Install dependencies
        run: npm ci

      - name: Install mobile dependencies
        run: npm ci --prefix mobile

      # When CI already passed on this exact commit on main, it ran npm test, so
      # the publish does not repeat it. Anything else, or a failed lookup, runs
      # the gate here as before.
      - name: Check whether CI passed on this commit on main
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          passed=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yaml/runs?head_sha=$GITHUB_SHA&event=push&branch=main&status=success&per_page=1" --jq '.total_count' 2>/dev/null || true)
          if [[ "$passed" =~ ^[1-9][0-9]*$ ]]; then tested=true; else tested=false; fi
          echo "tested=$tested" | tee -a "$GITHUB_OUTPUT"

      - name: Run test gate
        if: steps.ci.outputs.tested != 'true'
        run: npm test

      # prepack runs npm run build, so publish ships fresh artifacts.
      - name: Publish package
        run: npm publish --tag "${{ inputs.dist_tag }}"
