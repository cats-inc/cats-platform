name: Desktop state database

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/platform/persistence/state-db/**'
      - 'src/products/chat/state/**'
      - 'src/products/chat/shared/**'
      - 'src/products/chat/api/**'
      - 'src/app/server/index.ts'
      - 'src/app/server/startupRecovery.ts'
      - 'src/products/shared/renderer/api/transcript.ts'
      - 'src/index.ts'
      - 'src/shared/platformDataReset.ts'
      - 'desktop/host/processSupervisor.ts'
      - 'desktop/host/bootstrapPage.ts'
      - 'desktop/host/contracts.ts'
      - 'desktop/host/packaging.ts'
      - 'scripts/bundle-server.mjs'
      - 'tests/state-worker-bundling.test.js'
      - 'tests/desktop-state-*.test.js'
      - 'tests/fixtures/desktop-state-*.mjs'
      - 'scripts/testing/*desktop-state*.mjs'
      - '.github/workflows/desktop-state-database.yml'

permissions:
  contents: read

jobs:
  acceptance:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:server
      - run: npm run build:host
      - name: Node and shipped Electron acceptance
        run: node scripts/testing/run-desktop-state-host.mjs
      - name: Startup, reset and host integration
        run: npm run test:file -- tests/cli-entrypoint.test.js tests/desktop-supervisor.test.js tests/desktop-bootstrap-timeout.test.js tests/platform-data-reset.test.js tests/server-startup-recovery.test.js
      - name: Bundled worker and staging integration
        run: npm run test:file -- tests/state-worker-bundling.test.js tests/app-sdk-bundled-sidecar.test.js tests/desktop-packaging.test.js
