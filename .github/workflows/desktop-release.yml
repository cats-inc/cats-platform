name: cats-platform desktop release

# Tag-gated desktop release. Ordinary pushes and pull requests never reach this
# workflow, so CI cannot create a product version or publish a GitHub Release.
#
# The draft is created first, every platform uploads into it, a validation job
# checks the update metadata references real assets, and only then is the
# release published. A failed platform job therefore leaves no partially
# published latest stable release. Manual dispatch is a separate preview path:
# it exercises the same draft/build/validate/publish sequence but publishes
# only as a GitHub prerelease and never becomes latest. Per ADR-117 a preview
# is signed wherever credentials exist; that is artifact trust, not release
# identity, and it never makes the preview official.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          Preview tag to create from the selected branch. Must equal the current
          package.json version as vX.Y.Z, and must not already exist. Bump the
          package version first to run another preview.
        required: true
        type: string
      runtime_ref:
        description: 'cats-runtime ref to package against.'
        required: false
        default: main
        type: string

permissions:
  contents: read

env:
  CATS_SKIP_MOBILE: '1'
  # Source-controlled exact release URLs and SHA-256 hashes, never implicit latest.
  CATS_DESKTOP_APPS_LOCK: config/desktop-apps.lock.json

jobs:
  guard:
    name: Validate release identity
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      preview: ${{ steps.resolve.outputs.preview }}
      source_commit: ${{ steps.source.outputs.commit }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Resolve release identity
        id: resolve
        env:
          RESOLVED_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          echo "tag=$RESOLVED_TAG" >> "$GITHUB_OUTPUT"
          echo "version=${RESOLVED_TAG#v}" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "preview=true" >> "$GITHUB_OUTPUT"
          else
            echo "preview=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Record source commit
        id: source
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Runs before any expensive platform build so a mismatched tag fails fast.
      - name: Check tag matches both package files
        run: node scripts/validate-release-version.mjs --tag "${{ steps.resolve.outputs.tag }}"

  draft:
    name: Create draft release
    needs: guard
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.guard.outputs.source_commit }}

      - name: Create or reuse the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.guard.outputs.tag }}
          PREVIEW: ${{ needs.guard.outputs.preview }}
          COMMIT: ${{ needs.guard.outputs.source_commit }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" != "true" ]; then
              echo "Release $TAG is already published; refusing to replace its artifacts."
              exit 1
            fi
            echo "Draft release for $TAG already exists; reusing it."
          elif [ "$PREVIEW" = "true" ]; then
            gh release create "$TAG" --target "$COMMIT" --draft --prerelease --title "Cats $TAG (preview)" --generate-notes
          else
            gh release create "$TAG" --verify-tag --draft --title "Cats $TAG" --generate-notes
          fi

  build:
    name: Build ${{ matrix.platform }}
    needs: [guard, draft]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    strategy:
      # One platform failure must not cancel the others: the draft stays
      # unpublished either way, and partial results make triage easier.
      fail-fast: false
      matrix:
        # SPEC-111 section 8 names exactly one primary artifact per OS plus the
        # macOS updater ZIP. Formats and architectures are pinned here so
        # --publish never uploads PKG, DEB, tar.gz, or arm64 builds that are
        # outside the release contract.
        include:
          - platform: windows
            runner: windows-latest
            # Bundled sidecars rather than the wrapper's split default.
            extra_args: --sidecar-layout bundle --format nsis --arch x64
          - platform: macos
            runner: macos-latest
            extra_args: --format dmg,zip --arch x64
          - platform: linux
            runner: ubuntu-latest
            extra_args: --format deb --arch arm64
    defaults:
      run:
        working-directory: cats-platform
    steps:
      # The installer wrapper resolves cats-runtime as a sibling of the
      # platform checkout, and actions/checkout refuses any path outside the
      # workspace. Both repositories therefore live side by side inside it.
      - name: Checkout cats-platform
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.guard.outputs.source_commit }}
          path: cats-platform

      - name: Checkout cats-runtime
        uses: actions/checkout@v4
        with:
          repository: cats-inc/cats-runtime
          ref: ${{ inputs.runtime_ref || 'main' }}
          path: cats-runtime

      # shell: bash is required. The default shell on windows-latest is
      # PowerShell, where "$GITHUB_OUTPUT" resolves to an undefined variable
      # rather than the env var, so the step would appear to succeed while
      # recording nothing.
      - name: Record the packaged runtime commit
        id: runtime
        working-directory: cats-runtime
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: cats-platform/.nvmrc

      - name: Install platform dependencies
        run: npm ci

      # The wrapper runs `npm run build` inside cats-runtime, which needs its
      # own dependencies on a clean runner.
      - name: Install runtime dependencies
        working-directory: cats-runtime
        run: npm ci

      - name: Approve packaged install scripts
        run: npm rebuild electron

      # electron-builder reads APPLE_API_KEY as a path to the .p8 file rather
      # than as its contents, so the secret is materialized outside the
      # workspace first. Staging it through GITHUB_ENV rather than the build
      # step's own env block keeps the key file out of the packaged tree.
      #
      # ADR-117: previews are notarized too, so this runs on both guarded
      # paths. A preview without credentials degrades to unsigned rather than
      # failing -- mandating them is the release gate's job, not this step's.
      - name: Stage the notarization API key
        if: matrix.platform == 'macos'
        env:
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          IS_PREVIEW: ${{ needs.guard.outputs.preview }}
        run: |
          if [ -z "$APPLE_API_KEY_P8_BASE64" ]; then
            if [ "$IS_PREVIEW" = "true" ]; then
              echo 'APPLE_API_KEY_P8_BASE64 is not configured: this preview will be unsigned,'
              echo 'so it cannot be installed without a Gatekeeper bypass and cannot self-update.'
              exit 0
            fi
            echo 'APPLE_API_KEY_P8_BASE64 is not configured; refusing to build an official macOS release.'
            exit 1
          fi
          key_path="$RUNNER_TEMP/apple-api-key.p8"
          printf '%s' "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$key_path"
          chmod 600 "$key_path"
          echo "APPLE_API_KEY=$key_path" >> "$GITHUB_ENV"

      - name: Build installer
        env:
          # Anything in the GITHUB_ namespace is runner-provided and cannot be
          # overridden here, so the release tag travels as an explicit input.
          # GITHUB_TOKEN is not one of those defaults, so setting it works.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CATS_DESKTOP_RELEASE_TAG: ${{ needs.guard.outputs.tag }}
          CATS_DESKTOP_RELEASE_PLATFORM: ${{ matrix.platform }}
          CATS_DESKTOP_RUNTIME_COMMIT: ${{ steps.runtime.outputs.sha }}
          # ADR-117: credentials are scoped to the platform that can use them,
          # not to release identity, so previews sign wherever a certificate
          # exists. Scoping by platform also keeps the macOS certificate out of
          # the Windows job, where electron-builder would otherwise read a bare
          # CSC_LINK as its Windows certificate.
          WIN_CSC_LINK: ${{ matrix.platform == 'windows' && secrets.WIN_CSC_LINK || '' }}
          WIN_CSC_KEY_PASSWORD: ${{ matrix.platform == 'windows' && secrets.WIN_CSC_KEY_PASSWORD || '' }}
          CSC_LINK: ${{ matrix.platform == 'macos' && secrets.CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.platform == 'macos' && secrets.CSC_KEY_PASSWORD || '' }}
          # APPLE_API_KEY is the .p8 path staged above. These two complete the
          # App Store Connect key; electron-builder requires all three or it
          # refuses to notarize.
          APPLE_API_KEY_ID: ${{ matrix.platform == 'macos' && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ matrix.platform == 'macos' && secrets.APPLE_API_ISSUER || '' }}
        # Manual dispatch exercises packaging, metadata generation, artifact
        # upload, validation, and the update client itself. The preview embeds
        # a descriptor marked `preview`, so it can self-update while resolving
        # to its own distribution mode rather than claiming official identity.
        # A real tag run keeps the signed release and publish gates.
        run: >
          node scripts/build-desktop-installer.mjs
          --target ${{ matrix.platform }}
          --tag ${{ needs.guard.outputs.tag }}
          ${{ needs.guard.outputs.preview == 'true' && '--preview' || '--release' }}
          --publish always
          ${{ matrix.extra_args }}

      - name: Verify bundled App versions and offline activation
        run: node scripts/verify-desktop-app-bundle.mjs --release-root release --expect-lock config/desktop-apps.lock.json

      # Verification follows the credentials, not the release identity: a
      # signed preview is verified, and a platform with no certificate says so
      # rather than failing a build that was never going to be signed. An
      # official release cannot reach this step unsigned -- the release gate
      # refuses that build before packaging starts.
      - name: Verify Windows signature
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          HAS_CERT: ${{ secrets.WIN_CSC_LINK != '' }}
        run: |
          if ($env:HAS_CERT -ne 'true') {
            Write-Host 'No Windows certificate configured; this artifact is unsigned.'
            exit 0
          }
          $installer = Get-ChildItem release -Filter *.exe | Select-Object -First 1
          if (-not $installer) { throw 'No Windows installer was produced.' }
          $signature = Get-AuthenticodeSignature $installer.FullName
          Write-Host "status=$($signature.Status) signer=$($signature.SignerCertificate.Subject)"
          if ($signature.Status -ne 'Valid') {
            throw "Installer signature is $($signature.Status); refusing to release."
          }

      - name: Verify macOS signature and notarization
        if: matrix.platform == 'macos'
        env:
          HAS_CERT: ${{ secrets.CSC_LINK != '' }}
        run: |
          if [ "$HAS_CERT" != "true" ]; then
            echo 'No macOS certificate configured; this artifact is unsigned and cannot self-update.'
            exit 0
          fi
          app=$(find release -maxdepth 3 -name '*.app' | head -1)
          if [ -z "$app" ]; then echo 'No macOS app bundle was produced.'; exit 1; fi
          codesign --verify --deep --strict --verbose=2 "$app"
          # The Swift voice helper and the sidecar native addons ship under
          # Contents/Resources, which is the part of the bundle most likely to
          # be missed. Notarization rejects any unsigned Mach-O in there, so
          # check the helper explicitly rather than trusting --deep.
          helper="$app/Contents/Resources/native/macos-stt/cats-stt-macos"
          if [ ! -f "$helper" ]; then echo "Missing voice helper at $helper"; exit 1; fi
          codesign --verify --strict --verbose=2 "$helper"
          # Gatekeeper reads the stapled ticket offline, not the notarization
          # log, so an upload that succeeded but failed to staple must still
          # fail the release. The DMG and ZIP wrap this already-stapled app.
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose "$app"

      - name: Upload artifacts for validation
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.guard.outputs.preview == 'true' && 'preview' || 'release' }}-${{ matrix.platform }}
          # latest*.yml rather than *.yml: electron-builder also writes
          # builder-debug.yml and builder-effective-config.yaml into release/,
          # and those are build diagnostics, not release artifacts. Collecting
          # them would make the contract validator reject its own inputs.
          path: |
            cats-platform/release/*.exe
            cats-platform/release/*.dmg
            cats-platform/release/*.zip
            cats-platform/release/*.deb
            cats-platform/release/latest*.yml
            cats-platform/release/*.blockmap
          if-no-files-found: error
          retention-days: 7

  validate-assets:
    name: Validate release assets
    needs: [guard, build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.guard.outputs.source_commit }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # The validator parses the generated YAML with js-yaml, which is a
      # production dependency, so the job needs an install of its own.
      - name: Install dependencies
        run: npm ci --omit=dev

      - name: Download every platform's artifacts
        uses: actions/download-artifact@v4
        with:
          path: collected

      - name: Check update metadata references real files
        run: node scripts/validate-release-assets.mjs --root collected

  publish:
    name: Publish release
    needs: [guard, build, validate-assets]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.guard.outputs.source_commit }}

      - name: Publish the draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.guard.outputs.tag }}
          PREVIEW: ${{ needs.guard.outputs.preview }}
        run: |
          if [ "$PREVIEW" = "true" ]; then
            gh release edit "$TAG" --draft=false --prerelease
          else
            gh release edit "$TAG" --draft=false --latest
          fi
