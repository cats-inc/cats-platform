name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # A change confined to documentation skips install, typecheck and tests:
  # docs/, plus the root agent instructions (AGENTS.md, CLAUDE.md, CODEX.md and
  # GEMINI.md) when they are added or modified. So does code that already passed:
  # the fingerprint covers every tracked file outside docs/, and the root agent
  # instructions by mode, type and path only, so a rebase that only brings in docs
  # from main reuses the earlier green run. A pull request's cache is scoped to
  # that request, so a push to main instead reuses its merged pull request's run
  # when that run tested the same tree. The required nodejs (24) job still runs
  # and passes, so branch protection is satisfied; its matrix name stays stable
  # because only steps are skipped. Any other path, a manual run or a failed
  # detection runs every step. tests/docs-boundary.test.js keeps tests, scripts
  # and tools from reading docs/ or the root agent instructions.
  changes:
    runs-on: ubuntu-latest
    # Job permissions replace the defaults: checkout and the merge lookups read
    # contents, the merged pull request and its CI runs.
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      code: ${{ steps.paths.outputs.code }}
      fingerprint: ${{ steps.fingerprint.outputs.fingerprint }}
      skip: ${{ steps.plan.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect documentation-only changes
        id: paths
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            pull_request) base=HEAD^1 ;;
            push) base="$BEFORE" ;;
            *) base= ;;
          esac
          code=true
          # --no-renames lists both sides of a rename, so moving a file into
          # docs/ or renaming an agent instruction file counts as code. A root
          # agent instruction file counts as documentation only while it is
          # added or modified: validate and the skill sync scripts require the
          # root AGENTS.md, so a deletion, rename or type change is code. Nested
          # copies such as sub/AGENTS.md are code. Any git failure leaves
          # code=true.
          if [ -n "$base" ] && git rev-parse --verify --quiet "$base^{commit}" > /dev/null &&
            changed=$(git -c core.quotePath=false diff --no-renames --name-only "$base" HEAD) &&
            code_changed=$(git diff --no-renames --name-only "$base" HEAD -- . ':(top,exclude)docs/' \
              ':(top,exclude)AGENTS.md' ':(top,exclude)CLAUDE.md' ':(top,exclude)CODEX.md' ':(top,exclude)GEMINI.md') &&
            agents_removed=$(git diff --no-renames --name-only --diff-filter=am "$base" HEAD -- \
              ':(top)AGENTS.md' ':(top)CLAUDE.md' ':(top)CODEX.md' ':(top)GEMINI.md'); then
            printf 'Changed files:\n%s\n' "$changed"
            if [ -n "$changed" ] && [ -z "$code_changed" ] && [ -z "$agents_removed" ]; then code=false; fi
          fi
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"

      - name: Fingerprint the code under test
        id: fingerprint
        run: |
          set -euo pipefail
          # Mode, blob and path of every tracked file outside docs/. For a pull
          # request this is the merge result that the tests would exercise. The
          # root agent instructions keep their mode, type and path but not their
          # blob, so editing one keeps the fingerprint while adding, removing or
          # retyping one changes it. This format began with the ci-green-v2-
          # cache keys.
          fingerprint=$(git -c core.quotePath=false ls-tree -r --full-tree HEAD | awk -F '\t' '
            $2 ~ /^docs\// { next }
            $2 ~ /^(AGENTS|CLAUDE|CODEX|GEMINI)\.md$/ { split($1, entry, " "); print entry[1] " " entry[2] " agent-instructions\t" $2; next }
            { print }' | sha256sum | cut -d ' ' -f 1)
          echo "fingerprint=$fingerprint" | tee -a "$GITHUB_OUTPUT"

      - name: Look for an earlier green run of this exact code
        id: green
        if: steps.paths.outputs.code == 'true' && github.event_name != 'workflow_dispatch'
        uses: actions/cache/restore@v4
        with:
          path: .ci-green
          key: ci-green-v2-${{ steps.fingerprint.outputs.fingerprint }}
          lookup-only: true

      - name: Reuse the merged pull request's green run
        id: merged
        if: github.event_name == 'push' && steps.paths.outputs.code == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BEFORE: ${{ github.event.before }}
        run: |
          # Main requires up-to-date branches, so a squash merge lands the tree
          # its pull request's CI already passed. Reuse that run only when this
          # push adds one commit, the commit is a pull request's merge, the
          # request's final head contains the previous main and has this exact
          # tree, and CI passed on that head. Anything else, or any failed
          # lookup, runs every check.
          tested=false
          sha=$(git rev-parse HEAD)
          if [ -n "$BEFORE" ] && [ "$(git rev-parse --verify --quiet 'HEAD^' || true)" = "$BEFORE" ]; then
            pr=$(gh api "repos/$REPO/commits/$sha/pulls" --jq ".[] | select(.merge_commit_sha == \"$sha\") | \"\(.number) \(.head.sha)\"" 2>/dev/null | head -n 1 || true)
            number=${pr%% *}
            head=${pr##* }
            if [[ "$number" =~ ^[0-9]+$ && "$head" =~ ^[0-9a-f]{40}$ ]] &&
              git fetch --no-tags --quiet origin "refs/pull/$number/head" &&
              [ "$(git rev-parse FETCH_HEAD)" = "$head" ] &&
              git merge-base --is-ancestor "$BEFORE" "$head" &&
              [ "$(git rev-parse "$head^{tree}")" = "$(git rev-parse 'HEAD^{tree}')" ]; then
              passed=$(gh api "repos/$REPO/actions/workflows/ci.yaml/runs?head_sha=$head&event=pull_request&status=success&per_page=1" --jq '.total_count' 2>/dev/null || true)
              if [[ "$passed" =~ ^[1-9][0-9]*$ ]]; then
                tested=true
                echo "Pull request #$number passed CI on $head, which has this exact tree."
              fi
            fi
          fi
          echo "tested=$tested" | tee -a "$GITHUB_OUTPUT"

      - name: Decide what to skip
        id: plan
        env:
          CODE: ${{ steps.paths.outputs.code }}
          GREEN: ${{ steps.green.outputs.cache-hit }}
          MERGED: ${{ steps.merged.outputs.tested }}
        run: |
          set -euo pipefail
          skip=
          if [ "$CODE" = "false" ]; then skip=docs; elif [ "$GREEN" = "true" ] || [ "$MERGED" = "true" ]; then skip=tested; fi
          echo "skip=$skip" | tee -a "$GITHUB_OUTPUT"

  nodejs:
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A failed or skipped changes job runs every step, whatever it output.
    env:
      CHANGES_SKIP: ${{ needs.changes.result == 'success' && needs.changes.outputs.skip || '' }}
    strategy:
      matrix:
        node-version: ['24']

    steps:
      # npm-publish.yml and scripts/shared/source-selection.mjs read the names of
      # the Documentation-only change, Already tested and Test steps from the
      # jobs API.
      - name: Documentation-only change
        if: env.CHANGES_SKIP == 'docs'
        run: echo "Only docs/ or the root agent instructions (AGENTS.md, CLAUDE.md, CODEX.md, GEMINI.md) changed; install, typecheck and tests are skipped."

      - name: Already tested
        if: env.CHANGES_SKIP == 'tested'
        run: echo "This exact code outside docs/ and the root agent instructions already passed; install, typecheck and tests are skipped."

      - uses: actions/checkout@v4
        if: env.CHANGES_SKIP == ''

      - name: Use Node.js ${{ matrix.node-version }}
        if: env.CHANGES_SKIP == ''
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        if: env.CHANGES_SKIP == ''
        run: npm ci

      - name: Install mobile dependencies
        if: env.CHANGES_SKIP == ''
        run: npm ci --prefix mobile

      - name: Typecheck
        if: env.CHANGES_SKIP == ''
        run: npm run typecheck

      - name: Test
        if: env.CHANGES_SKIP == ''
        run: npm test

      # Reached only when every step above passed. A failed detection leaves no
      # fingerprint, so nothing is recorded.
      - name: Record this code as tested
        if: env.CHANGES_SKIP == '' && needs.changes.outputs.fingerprint != ''
        env:
          FINGERPRINT: ${{ needs.changes.outputs.fingerprint }}
        run: |
          mkdir -p .ci-green
          echo "$FINGERPRINT $GITHUB_RUN_ID" > .ci-green/marker

      - name: Save the tested marker
        if: env.CHANGES_SKIP == '' && needs.changes.outputs.fingerprint != ''
        uses: actions/cache/save@v4
        with:
          path: .ci-green
          key: ci-green-v2-${{ needs.changes.outputs.fingerprint }}

  desktop-state:
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    uses: ./.github/workflows/desktop-state-database.yml

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check required files exist
        run: |
          echo "Checking required files..."
          test -f README.md || (echo "Missing README.md" && exit 1)
          test -f AGENTS.md || (echo "Missing AGENTS.md" && exit 1)
          test -f LICENSE || (echo "Missing LICENSE" && exit 1)
          echo "All required files present."
