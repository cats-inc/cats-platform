name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # A change confined to docs/ skips install, typecheck and tests. The required
  # nodejs (24) job still runs and passes, so branch protection is satisfied;
  # its matrix name stays stable because only steps are skipped. Any other path,
  # a manual run or a failed detection runs every step.
  # tests/docs-boundary.test.js keeps tests, scripts and tools from reading docs/.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.paths.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect documentation-only changes
        id: paths
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            pull_request) base=HEAD^1 ;;
            push) base="$BEFORE" ;;
            *) base= ;;
          esac
          code=true
          if [ -n "$base" ] && git rev-parse --verify --quiet "$base^{commit}" > /dev/null; then
            changed=$(git diff --name-only "$base" HEAD)
            printf 'Changed files:\n%s\n' "$changed"
            if [ -n "$changed" ] && ! grep -qv '^docs/' <<< "$changed"; then code=false; fi
          fi
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"

  nodejs:
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        node-version: ['24']

    steps:
      - name: Documentation-only change
        if: needs.changes.outputs.code == 'false'
        run: echo "Only docs/ changed; install, typecheck and tests are skipped."

      - uses: actions/checkout@v4
        if: needs.changes.outputs.code != 'false'

      - name: Use Node.js ${{ matrix.node-version }}
        if: needs.changes.outputs.code != 'false'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        if: needs.changes.outputs.code != 'false'
        run: npm ci

      - name: Install mobile dependencies
        if: needs.changes.outputs.code != 'false'
        run: npm ci --prefix mobile

      - name: Typecheck
        if: needs.changes.outputs.code != 'false'
        run: npm run typecheck

      - name: Test
        if: needs.changes.outputs.code != 'false'
        run: npm test

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check required files exist
        run: |
          echo "Checking required files..."
          test -f README.md || (echo "Missing README.md" && exit 1)
          test -f AGENTS.md || (echo "Missing AGENTS.md" && exit 1)
          test -f LICENSE || (echo "Missing LICENSE" && exit 1)
          echo "All required files present."
