name: Share Apple signing credentials (temporary)

# One-time authorized migration. Remove before merging this branch.
# Usage: push this exact branch; download ciphertext only, then import through
# the organization's authenticated secrets API. This workflow cannot write secrets.
on:
  push:
    branches: [docs/shared-apple-signing]
    paths: [.github/workflows/share-apple-signing-temporary.yml]

permissions:
  contents: read

jobs:
  encrypt:
    if: github.repository == 'cats-inc/cats-platform'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Install hash-pinned encryption library without credentials
        shell: bash
        run: |
          set -euo pipefail
          python3.12 -m venv "$RUNNER_TEMP/signing-encryption"
          cat > "$RUNNER_TEMP/signing-encryption.txt" <<'REQUIREMENTS'
          PyNaCl==1.6.2 --hash=sha256:8a66d6fb6ae7661c58995f9c6435bda2b1e68b54b598a6a10247bfcdadac996c
          cffi==2.0.0 --hash=sha256:3e17ed538242334bf70832644a32a7aae3d83b57567f9fd60a26257e992b79ba
          pycparser==2.23 --hash=sha256:e5c6e8d3fbad53479cab09ac03729e0a9faf2bee3db8208a550daf5af81a5934
          REQUIREMENTS
          "$RUNNER_TEMP/signing-encryption/bin/python" -m pip install --only-binary=:all: --require-hashes -r "$RUNNER_TEMP/signing-encryption.txt"
      - name: Seal existing secrets to the cats-inc organization public key
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          "$RUNNER_TEMP/signing-encryption/bin/python" - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path
          from nacl import public

          names = ["CSC_LINK", "CSC_KEY_PASSWORD", "APPLE_API_KEY_P8_BASE64", "APPLE_API_KEY_ID", "APPLE_API_ISSUER"]
          if any(not os.environ.get(name) for name in names):
              raise SystemExit("Incomplete source signing credentials")
          # Verified using GET /orgs/cats-inc/actions/secrets/public-key.
          # Fixed recipient: never accept an arbitrary public key as input.
          key = public.PublicKey(base64.b64decode("I71D/LXhx3tQodSnZ8XmmWTM0lJ3f3dX2D6+prt+jn4=", validate=True))
          box = public.SealedBox(key)
          payload = {
              "schema": 1,
              "organization": "cats-inc",
              "key_id": "3380204578043523366",
              "source_repository": os.environ["GITHUB_REPOSITORY"],
              "source_commit": os.environ["GITHUB_SHA"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "secrets": [{"name": name, "encrypted_value": base64.b64encode(box.encrypt(os.environ[name].encode("utf-8"))).decode("ascii")} for name in names],
          }
          target = Path(os.environ["RUNNER_TEMP"]) / "apple-signing.enc.json"
          target.write_text(json.dumps(payload), encoding="utf-8")
          target.chmod(0o600)
          print("Sealed five credentials for cats-inc; no plaintext output.")
          PY
      - name: Upload only organization-encrypted ciphertext
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: apple-signing-for-cats-inc
          path: ${{ runner.temp }}/apple-signing.enc.json
          if-no-files-found: error
          retention-days: 1
